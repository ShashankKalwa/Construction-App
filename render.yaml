services:
  - type: web
    name: cms-backend
    runtime: java
    plan: free
    buildCommand: ./gradlew :backend:bootJar
    startCommand: java -jar backend/build/libs/backend-0.0.1-SNAPSHOT.jar
    healthCheckPath: /api/v1/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        value: postgres
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
