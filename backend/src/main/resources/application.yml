spring:
  application:
    name: cms-backend
  profiles:
    active: dev

server:
  port: ${PORT:8000}

cms:
  auth:
    allow-demo-passwords: ${ALLOW_DEMO_PASSWORDS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
